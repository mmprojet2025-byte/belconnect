# A separate schema preserves all local application data during tests.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/belconnect}
spring.datasource.username=${DB_USER:belconnect}
spring.datasource.password=${DB_PASSWORD:belconnect_dev}
spring.datasource.hikari.schema=belconnect_test
spring.flyway.schemas=belconnect_test
spring.flyway.default-schema=belconnect_test
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
belconnect.demo-paid-publication=true
