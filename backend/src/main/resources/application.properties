spring.application.name=belconnect-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/belconnect}
spring.datasource.username=${DB_USER:belconnect}
spring.datasource.password=${DB_PASSWORD:belconnect_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health

spring.profiles.default=local

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
