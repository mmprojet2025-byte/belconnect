services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: belconnect
      POSTGRES_USER: belconnect
      POSTGRES_PASSWORD: belconnect_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - belconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belconnect -d belconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  belconnect_postgres_data:

